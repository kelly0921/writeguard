services:
  pilot-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: writeguard
      POSTGRES_PASSWORD: writeguard
      POSTGRES_DB: writeguard_pilot
    ports:
      - "127.0.0.1:54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writeguard -d writeguard_pilot"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - writeguard_pilot_postgres_data:/var/lib/postgresql/data

volumes:
  writeguard_pilot_postgres_data:
