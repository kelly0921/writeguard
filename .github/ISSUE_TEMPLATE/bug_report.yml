name: Bug report
description: Report a reproducible WriteGuard defect without sensitive data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials, customer data, raw provider payloads, or operation keys here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the smallest deterministic reproduction and commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, operating system, storage adapter, and whether the provider was simulated, test mode, or production.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized receipt or diagnostics
      description: Remove credentials, personal data, provider payloads, and stable business identifiers before sharing.
