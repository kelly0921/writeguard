name: WriteGuard evaluation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-evaluation:
    name: Local evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm evaluate:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writeguard-evaluation-${{ matrix.os }}
          path: .writeguard/evaluation-*
          if-no-files-found: error
