name: WriteGuard evaluation

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-evaluation:
    name: Local evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm validate:generated-artifacts
      - run: pnpm package:verify-generator
      - run: pnpm verify:core-openai-boundary
      - run: pnpm verify:generator-boundary
      - run: pnpm security:scan
      - run: pnpm docs:scan
      - run: pnpm evaluate:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writeguard-evaluation-${{ matrix.os }}
          path: .writeguard/evaluation-*
          if-no-files-found: error
