<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unsafe retry compared with WriteGuard</title>
  <desc id="desc">A side-by-side simulated failure timeline showing two effects from an unsafe retry and one effect with WriteGuard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060812"/><stop offset="1" stop-color="#10162A"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1A111B"/><stop offset="1" stop-color="#10101C"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0D1B22"/><stop offset="1" stop-color="#0B121D"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#93A2D0" stroke-opacity="0.06"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="78" fill="#F7F9FF" font-size="48" font-weight="780" letter-spacing="-1.5">When success is real—but the acknowledgement is lost</text>
    <text x="80" y="120" fill="#91A1C7" font-size="22">The retry decision determines whether the external effect is repeated.</text>

    <g transform="translate(70 165)" filter="url(#shadow)">
      <rect width="700" height="660" rx="30" fill="url(#left)" stroke="#56303A" stroke-width="2"/>
      <rect x="28" y="28" width="156" height="38" rx="19" fill="#2B151C" stroke="#793442"/>
      <circle cx="50" cy="47" r="6" fill="#FF6B78"/>
      <text x="67" y="54" fill="#FFB2B9" font-size="16" font-weight="760">UNSAFE RETRY</text>
      <text x="28" y="110" fill="#FFFFFF" font-size="32" font-weight="750">New call identity on every retry</text>
      <text x="28" y="143" fill="#A99AAA" font-size="18">The provider cannot recognize the same business operation.</text>

      <line x1="82" y1="202" x2="82" y2="492" stroke="#6D3340" stroke-width="4"/>
      <g transform="translate(52 184)"><circle cx="30" cy="30" r="29" fill="#2A1720" stroke="#9B4050" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#FFD4D8" font-size="18" font-weight="760">1</text></g>
      <g transform="translate(120 184)"><text y="22" fill="#F6E9EC" font-size="21" font-weight="720">Provider succeeds</text><text y="52" fill="#AA99A0" font-size="17">First external effect is created.</text></g>
      <g transform="translate(52 284)"><circle cx="30" cy="30" r="29" fill="#2A1720" stroke="#9B4050" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#FFD4D8" font-size="18" font-weight="760">2</text></g>
      <g transform="translate(120 284)"><text y="22" fill="#F6E9EC" font-size="21" font-weight="720">Acknowledgement times out</text><text y="52" fill="#AA99A0" font-size="17">The agent cannot see the success.</text></g>
      <g transform="translate(52 384)"><circle cx="30" cy="30" r="29" fill="#2A1720" stroke="#9B4050" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#FFD4D8" font-size="18" font-weight="760">3</text></g>
      <g transform="translate(120 384)"><text y="22" fill="#F6E9EC" font-size="21" font-weight="720">Agent retries blindly</text><text y="52" fill="#AA99A0" font-size="17">A second provider effect is created.</text></g>

      <g transform="translate(28 520)">
        <rect width="644" height="108" rx="20" fill="#2A141B" stroke="#8E3948"/>
        <text x="26" y="36" fill="#CFA7AE" font-size="15" font-weight="700" letter-spacing="1.6">DEMONSTRATED SIMULATION</text>
        <text x="26" y="82" fill="#FFFFFF" font-size="35" font-weight="800">2 external effects</text>
        <circle cx="562" cy="54" r="24" fill="#FF6B78"/><text x="562" y="63" text-anchor="middle" fill="#1E0A0E" font-size="26" font-weight="850">2</text>
      </g>
    </g>

    <g transform="translate(830 165)" filter="url(#shadow)">
      <rect width="700" height="660" rx="30" fill="url(#right)" stroke="#24565D" stroke-width="2"/>
      <rect x="28" y="28" width="188" height="38" rx="19" fill="#102F31" stroke="#28706D"/>
      <circle cx="50" cy="47" r="6" fill="#63E6BE"/>
      <text x="67" y="54" fill="#ADF3DE" font-size="16" font-weight="760">WITH WRITEGUARD</text>
      <text x="28" y="110" fill="#FFFFFF" font-size="32" font-weight="750">Stable business-operation identity</text>
      <text x="28" y="143" fill="#91ABA9" font-size="18">Uncertainty is reconciled before another provider write.</text>

      <line x1="82" y1="202" x2="82" y2="492" stroke="#286369" stroke-width="4"/>
      <g transform="translate(52 184)"><circle cx="30" cy="30" r="29" fill="#10272B" stroke="#2A7A78" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#D0FFF2" font-size="18" font-weight="760">1</text></g>
      <g transform="translate(120 184)"><text y="22" fill="#EDFFFA" font-size="21" font-weight="720">Provider succeeds</text><text y="52" fill="#91ABA9" font-size="17">One external effect is created.</text></g>
      <g transform="translate(52 284)"><circle cx="30" cy="30" r="29" fill="#10272B" stroke="#2A7A78" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#D0FFF2" font-size="18" font-weight="760">2</text></g>
      <g transform="translate(120 284)"><text y="22" fill="#EDFFFA" font-size="21" font-weight="720">WriteGuard records uncertainty</text><text y="52" fill="#91ABA9" font-size="17">The operation remains bound to one identity.</text></g>
      <g transform="translate(52 384)"><circle cx="30" cy="30" r="29" fill="#10272B" stroke="#2A7A78" stroke-width="2"/><text x="30" y="37" text-anchor="middle" fill="#D0FFF2" font-size="18" font-weight="760">3</text></g>
      <g transform="translate(120 384)"><text y="22" fill="#EDFFFA" font-size="21" font-weight="720">Reconcile before retry</text><text y="52" fill="#91ABA9" font-size="17">The existing provider result is recovered.</text></g>

      <g transform="translate(28 520)">
        <rect width="644" height="108" rx="20" fill="#0D292B" stroke="#27706D"/>
        <text x="26" y="36" fill="#9ED8CD" font-size="15" font-weight="700" letter-spacing="1.6">DEMONSTRATED SIMULATION</text>
        <text x="26" y="82" fill="#FFFFFF" font-size="35" font-weight="800">1 external effect</text>
        <circle cx="562" cy="54" r="24" fill="#63E6BE"/><text x="562" y="63" text-anchor="middle" fill="#09201D" font-size="26" font-weight="850">1</text>
      </g>
    </g>
  </g>
</svg>
