services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: closure
      POSTGRES_PASSWORD: closure
      POSTGRES_DB: closure
    ports:
      - "54327:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closure -d closure"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - closure_postgres_data:/var/lib/postgresql/data

volumes:
  closure_postgres_data:
